[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sagittal_average"
version = "0.1.0"
description = "Compute sagittal averages of brain images"
authors = [
    {name = "Charlene Bultoc"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.md"}

dependencies = [
    "numpy"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sagittal_average_run = "sagittal_average.command:main"

